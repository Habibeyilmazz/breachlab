{% extends "app.html" %}
{% block heading %}Team board{% endblock %}
{% block content %}
<h1>Team board</h1>
<form method="post" class="qb-form">
  <label for="body">New note, visible to everyone in the workspace</label>
  <textarea id="body" name="body" rows="3" maxlength="2000" required></textarea>
  <button class="qb-btn">Post note</button>
</form>
<ul class="qb-notes">
  {% for note in notes %}
  <li>
    <div class="qb-note-body">{{ render_note(note.body) }}</div>
    <p class="qb-muted">{{ note.display_name }}, {{ note.created_at }}</p>
  </li>
  {% endfor %}
</ul>
{% endblock %}
